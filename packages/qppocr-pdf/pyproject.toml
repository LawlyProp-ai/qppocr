[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qppocr-pdf"
version = "0.1.0"
description = "Per-page PDF routing between embedded text and qppocr OCR"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
dependencies = [
    "qppocr",
    "pypdfium2==5.13.0",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
ignore_missing_imports = true
