[package]
name = "qppocr-py"
description = "qppocr 的 Python 绑定（PyO3 / maturin）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "qppocr_py"
crate-type = ["cdylib"]

[dependencies]
qppocr = { path = "../qppocr", version = "0.2.1" }
# abi3-py38 -> one wheel installs on CPython 3.8..3.14+ (stable ABI).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }

[lints]
workspace = true
